name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Generate the exact Cargo lockfile for review
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          echo '---BEGIN-CARGO-LOCK---'
          cat Cargo.lock
          echo '---END-CARGO-LOCK---'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Validate canonical Zed dependencies
        shell: bash
        run: |
          set -euo pipefail
          for dependency in \
            hacker-house-medellin/hhm-clients \
            hacker-house-medellin/hhm-interfaces \
            hacker-house-medellin/hhm-libs \
            hacker-house-medellin/hhm-cli \
            hacker-house-medellin/hhm-sync \
            shared-auth/shared-auth-clients
          do
            grep -Fq "\"${dependency}\"" .zpkg.toml
          done
          grep -Fq 'dir = ".vendor/.zed"' .zpkg.toml
